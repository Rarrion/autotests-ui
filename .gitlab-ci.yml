# -----------------------------------------------------------------------------
# GitLab CI pipeline: запуск UI-тестов и публикация Allure отчета
# -----------------------------------------------------------------------------

# Определяем стадии пайплайна:
# - test: установка окружения, запуск автотестов, генерация отчета
# - deploy: публикация HTML-отчета через GitLab Pages
stages:
  - test
  - deploy

# Переменные окружения для всех джоб пайплайна.
# В контейнере GitLab Runner нет дисплея, поэтому браузеры запускаем в headless-режиме.
# В .env указано HEADLESS=false (для локального запуска), но переменная окружения
# имеет приоритет над значением из .env
variables:
  HEADLESS: "true"

# -----------------------------------------------------------------------------
# Джоба №1 — установка окружения, запуск тестов, генерация Allure-отчета
# -----------------------------------------------------------------------------
run-tests:
  stage: test

  # Используем официальный образ Ubuntu.
  # Это дает возможность устанавливать системные зависимости через apt.
  image: ubuntu:24.04

  # Даже если тесты упадут, пайплайн должен продолжить выполнение.
  # Это необходимо, чтобы Allure-отчет был опубликован в любом случае.
  allow_failure: true

  # before_script выполняется перед основными командами.
  before_script:
    # ------------------------------------------
    # 1. Подготовка системного окружения
    # ------------------------------------------

    # Обновляем индекс пакетов.
    - apt-get update

    # Устанавливаем необходимые системные компоненты:
    # python3.12           — интерпретатор Python
    # python3.12-venv      — создание виртуальных окружений
    # python3-pip          — менеджер пакетов pip
    # openjdk-11-jre       — Java Runtime (необходим для Allure CLI)
    # wget, tar            — инструменты скачивания и распаковки архивов
    - apt-get install -y python3.12 python3.12-venv python3-pip openjdk-11-jre wget tar

    # ------------------------------------------
    # 2. Установка Allure Commandline
    # ------------------------------------------

    # Скачиваем официальный архив Allure CLI.
    - wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz

    # Распаковываем архив (создаст каталог allure-2.32.0/).
    - tar -xvf allure-2.32.0.tgz

    # ------------------------------------------
    # 3. Настройка Python-окружения
    # ------------------------------------------

    # Создаем и активируем виртуальное окружение Python.
    - python3.12 -m venv venv
    - source venv/bin/activate

    # Устанавливаем зависимости проекта (pytest, playwright и т.д.).
    - pip install -r requirements.txt

    # Устанавливаем браузеры и их системные зависимости для Playwright.
    - playwright install --with-deps

  # Основной блок: запуск тестов и формирование Allure-результатов
  script:
    # Запускаем тесты. Результаты сохраняются в allure-results/.
    - pytest -m regression --alluredir=allure-results --numprocesses 2

    # Генерируем HTML-отчет через Allure CLI.
    - allure-2.32.0/bin/allure generate allure-results -o allure-report --clean

  # Сохраняем результаты тестов и отчет как артефакты,
  # чтобы передать их в следующую джобу (pages).
  artifacts:
    paths:
      - allure-results/
      - allure-report/
    expire_in: 7 days       # храним 7 дней
    when: always            # сохраняем даже при падении тестов

  # Запускаем джобу только при пушах в ветку main.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# -----------------------------------------------------------------------------
# Джоба №2 — публикация Allure-отчета на GitLab Pages
# -----------------------------------------------------------------------------
pages:
  stage: deploy

  script:
    # GitLab Pages публикует только директорию public/.
    - mkdir -p public
    - cp -r allure-report/* public/

  artifacts:
    paths:
      - public

  # Выполнять публикацию только после завершения run-tests.
  needs: ["run-tests"]

  # Публикуем только из ветки main.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
