# Имя вашего workflow, которое будет отображаться в интерфейсе GitHub Actions
name: UI tests

# Указываем, когда будет запускаться данный workflow
on:
  push:
    branches:
      - main  # Запускать workflow, когда будет сделан коммит в ветку main
  pull_request:
    branches:
      - main  # Запускать workflow, когда будет сделан pull request в ветку main

# Даем токену GITHUB_TOKEN право на запись в репозиторий: оно нужно для публикации отчета в ветку gh-pages.
# Благодаря этому не нужно менять настройки репозитория (Settings → Actions → General → Workflow permissions)
permissions:
  contents: write

# Переменные окружения для всех шагов workflow.
# На раннере GitHub Actions нет дисплея, поэтому браузеры запускаем в headless-режиме.
# В .env указано HEADLESS=false (для локального запуска), но переменная окружения
# имеет приоритет над значением из .env
env:
  HEADLESS: "true"

# Определяем все шаги, которые должны быть выполнены в рамках работы с тестами
jobs:
  run-tests:
    runs-on: ubuntu-latest  # Указываем, что тесты будут запускаться на последней версии Ubuntu

    steps:
      # 1. Шаг, который будет клонировать ваш репозиторий на машину GitHub Actions
      - name: Check out repository
        uses: actions/checkout@v7  # Используем GitHub Action для клонирования репозитория

      # 2. Шаг для установки Python на виртуальной машине
      - name: Set up Python
        uses: actions/setup-python@v7  # Используем GitHub Action для установки Python
        with:
          python-version: '3.11'  # Устанавливаем версию Python 3.11

      # 3. Шаг для установки всех зависимостей проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip  # Обновляем pip до последней версии
          pip install -r requirements.txt  # Устанавливаем зависимости, указанные в requirements.txt
          playwright install --with-deps  # Устанавливаем браузеры для Playwright и их системные зависимости

      # 4. Шаг для запуска тестов с использованием pytest и генерации результатов для Allure
      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2  # Запускаем тесты, отмеченные как "regression", генерируем результаты для Allure

      # 5. Шаг для получения истории отчетов Allure, если она существует
      - name: Get Allure history
        uses: actions/checkout@v7  # Опять клонируем репозиторий, чтобы получить историю отчетов
        if: always()  # Всегда выполняем, независимо от успеха или неудачи предыдущих шагов
        continue-on-error: true  # Если здесь возникнет ошибка (например, ветки gh-pages еще нет), workflow продолжит выполнение
        with:
          ref: gh-pages  # Указываем ветку gh-pages для получения отчетов
          path: gh-pages  # Указываем путь для сохранения отчетов

      # 6. Шаг для генерации отчета Allure с историей
      - name: Generates Allure Report with history
        uses: simple-elf/allure-report-action@v1.15  # Используем готовое решение из GitHub Marketplace для генерации Allure отчета
        if: always()  # Этот шаг тоже всегда выполняется
        with:
          allure_results: allure-results  # Указываем каталог с результатами тестов
          allure_history: allure-history  # Указываем каталог для истории отчетов Allure

      # 7. Шаг для деплоя отчета Allure на GitHub Pages, чтобы его можно было просматривать в браузере
      - name: Deploy report to Github Pages
        if: always()  # Выполняется всегда, независимо от успеха других шагов
        uses: peaceiris/actions-gh-pages@v4  # Используем GitHub Action для публикации отчета на GitHub Pages
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Токен для аутентификации на GitHub
          publish_branch: gh-pages  # Указываем, что отчет будет опубликован в ветке gh-pages
          publish_dir: allure-history  # Указываем папку, которая будет опубликована на GitHub Pages
